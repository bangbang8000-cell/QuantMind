bridge:
  name: "bridge-windows"
  log_level: "INFO"

cache:
  enabled: true

security:
  rate_limit_per_minute: 60
  write_rate_limit: 10
  fail_ban_threshold: 5
  fail_ban_seconds: 30

ui:
  auto_open: true

auth:
  token: "8bbe5347f916982abc4f0620ab0d0b500a9cae69f51fa832a971646113b6c522"
  extra_tokens: ""

channels:
  mode: "auto"
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8550
    timeout_seconds: 30
  file_sync:
    enabled: true
    shared_dir: ""

failover:
  primary_channel: "http"
  fallback_channel: "file_sync"
  http_max_retries: 3
  http_retry_delay_ms: 1000
  health_check_interval_seconds: 10
  auto_recover_http: true

tdx:
  base_url: "http://127.0.0.1:17709/"
  request_timeout_seconds: 15
  max_retries: 2

sltp_daemon:
  enabled: true
  poll_interval_seconds: 5

order_tracking:
  state_file: "./data/active_orders.json"
  sync_interval_seconds: 15
